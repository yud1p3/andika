<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/statik/app.css">
  <script src="/statik/htmx.min.js" defer></script>
  <script src="/statik/sse.min.js" defer></script>
</head>
<!--
  Tinggi halaman dikunci ke tinggi layar (h-dvh) dan isinya disusun sebagai
  kolom. Dengan begitu hanya daftar jawaban (#log) yang menggulir, sementara
  kotak pertanyaan tetap menempel di bawah layar. Tanpa ini kotak pertanyaan
  ikut tergulir ke atas begitu jawaban bertambah panjang, dan pengguna harus
  menggulir balik untuk bertanya lagi.
-->
<body class="h-dvh bg-slate-100 text-slate-900 antialiased">
  <div class="mx-auto flex h-full max-w-3xl flex-col px-4">

    <header class="shrink-0 pt-6 pb-4">
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 class="text-2xl font-bold tracking-tight">{{.Title}}</h1>
          <p class="mt-1 text-sm text-slate-600">
            {{.Subtitle}}
          </p>
        </div>
        <!--
          Mengosongkan riwayat percakapan sesi ini. Server membalas dengan
          pesan singkat, dan htmx menukar seluruh isi #log — jadi jawaban lama
          ikut hilang dari layar, sejalan dengan konteksnya yang hilang dari
          memori. Balasan itu wajib berisi markup; htmx tidak melakukan swap
          kalau responsnya kosong.
        -->
        <button hx-post="/baru"
                hx-target="#log"
                hx-swap="innerHTML"
                class="shrink-0 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium text-slate-600 shadow-sm transition hover:bg-slate-50">
          Percakapan baru
        </button>
      </div>
      <p class="mt-3 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
        <span>Model: <span class="font-medium text-slate-700">{{.Model}}</span></span>
        <span>Collection: <span class="font-medium text-slate-700">{{.Collection}}</span></span>
        <span>top-k: <span class="font-medium text-slate-700">{{.TopK}}</span></span>
      </p>
    </header>

    <!--
      Satu-satunya bagian yang menggulir.

      min-h-0 wajib ada: tanpa itu anak flex menolak menyusut di bawah tinggi
      isinya, sehingga #log memanjang dan mendorong formulir keluar layar —
      persis masalah yang ingin dihindari.

      scroll-pb-4 adalah jarak yang disisakan saat htmx menggulirkan jawaban
      terbaru ke bawah (lihat show:bottom di formulir dan di fragmen).
    -->
    <main id="log"
          class="min-h-0 flex-1 space-y-4 overflow-y-auto scroll-pb-4 pb-4"></main>

    <!--
      Formulir mengirim pertanyaan sebagai query string ke /tanya. Server
      mengembalikan fragmen berisi elemen SSE, dan htmx menambahkannya ke #log.
      Koneksi SSE-nya baru dibuka setelah fragmen itu masuk ke DOM.

      show:bottom menggulirkan #log sampai fragmen baru terlihat: menambah isi
      di ujung daftar tidak otomatis menggeser posisi gulir.
    -->
    <form hx-get="/tanya"
          hx-target="#log"
          hx-swap="beforeend show:bottom"
          hx-indicator="#memuat"
          hx-disabled-elt="find button"
          hx-on::after-request="if (event.detail.successful) this.reset()"
          class="shrink-0 border-t border-slate-200 pt-4 pb-4">
      <div class="flex gap-2">
        <input name="q" required autofocus autocomplete="off"
               placeholder="Tulis pertanyaan tentang isi dokumen…"
               class="min-w-0 flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
        <button type="submit"
                class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-sky-700 disabled:opacity-50">
          Tanya
        </button>
      </div>
    <!--
      Pertanyaan contoh. Banyak pengunjung tidak tahu dokumen ini memuat apa,
      jadi pertanyaan pertama yang paling sulit dijawab adalah "mau tanya apa".
      Tombol-tombol ini menjawabnya dengan menunjukkan sendiri.

      type="button" wajib: tanpa itu peramban menganggapnya tombol kirim dan
      formulir ikut terkirim, sehingga satu klik menjalankan dua permintaan.

      hx-vals dipakai supaya pertanyaannya ditulis apa adanya, bukan sebagai
      query string yang sudah di-encode — teksnya di sini sekaligus jadi label
      tombolnya, dan keduanya harus sama.

      Tombol ini berada di dalam formulir supaya ikut kena hx-disabled-elt
      ("find button"): selama jawaban masih mengalir, semuanya mati, dan
      permintaan yang saling menimpa tidak mungkin terjadi.
    -->
    <div class="mt-3 flex flex-wrap gap-1.5">
      <button type="button"
              hx-get="/tanya"
              hx-vals='{"q":"Jenis naskah dinas apa saja?"}'
              hx-target="#log" hx-swap="beforeend show:bottom"
              hx-indicator="#memuat" hx-disabled-elt="this"
              class="rounded-full border border-slate-300 bg-white px-3 py-1 text-xs text-slate-600 shadow-sm transition hover:border-sky-400 hover:text-sky-700 disabled:opacity-50">
        Jenis naskah dinas apa saja?
      </button>
      <button type="button"
              hx-get="/tanya"
              hx-vals='{"q":"Siapa yang berwenang menandatangani surat dinas?"}'
              hx-target="#log" hx-swap="beforeend show:bottom"
              hx-indicator="#memuat" hx-disabled-elt="this"
              class="rounded-full border border-slate-300 bg-white px-3 py-1 text-xs text-slate-600 shadow-sm transition hover:border-sky-400 hover:text-sky-700 disabled:opacity-50">
        Siapa yang berwenang menandatangani surat dinas?
      </button>
      <button type="button"
              hx-get="/tanya"
              hx-vals='{"q":"Bagaimana aturan penomoran naskah dinas?"}'
              hx-target="#log" hx-swap="beforeend show:bottom"
              hx-indicator="#memuat" hx-disabled-elt="this"
              class="rounded-full border border-slate-300 bg-white px-3 py-1 text-xs text-slate-600 shadow-sm transition hover:border-sky-400 hover:text-sky-700 disabled:opacity-50">
        Bagaimana aturan penomoran naskah dinas?
      </button>
      <button type="button"
              hx-get="/tanya"
              hx-vals='{"q":"Apa yang dimaksud dengan lembar disposisi?"}'
              hx-target="#log" hx-swap="beforeend show:bottom"
              hx-indicator="#memuat" hx-disabled-elt="this"
              class="rounded-full border border-slate-300 bg-white px-3 py-1 text-xs text-slate-600 shadow-sm transition hover:border-sky-400 hover:text-sky-700 disabled:opacity-50">
        Apa yang dimaksud dengan lembar disposisi?
      </button>
    </div>

      <div class="mt-2 flex items-baseline justify-between gap-4">
        <p class="text-xs text-slate-400">
          Jawaban disusun hanya dari isi dokumen.
        </p>
        <!-- htmx-indicator memudar, bukan menghilang, jadi tinggi baris ini
             tidak berubah saat status muncul dan hilang. -->
        <p id="memuat" class="htmx-indicator text-xs text-slate-500">
          Menyiapkan…
        </p>
      </div>
    </form>
  </div>
</body>
</html>
